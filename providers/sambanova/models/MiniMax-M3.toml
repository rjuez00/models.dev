# Retired: SambaNova no longer lists MiniMax-M3 in GET /v1/models or the supported-models page, and a
#   request with model=MiniMax-M3 returns model=MiniMax-M3.1-Flash (live 2026-10-31). Keep the old ID as
#   a deprecated alias of the replacement entry.
# Effort: reasoning_effort = low|medium|high|xhigh|max; thinking cannot be disabled.
# Limits/pricing: same as MiniMax-M3.1-Flash (1048576/1048576; 0.30 input / 1.20 output / 0.03 cached).
schema = 2
base_model = "minimax/MiniMax-M3.1-Flash"
name = "MiniMax-M3"
status = "deprecated"

[capabilities]
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh", "max"] }

[limit]
context = 1_048_576
output = 1_048_576

[cost.text.input]
price = 0.3
cache = { read = 0.03 }

[cost.text.output]
price = 1.2
